<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Events — Hiking Trails</title>
<meta name="description" content="Guided hikes, river days, trail work and races along the Winkler Botanical Preserve and the the pond." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<style>

/* this page sits on a white bar */
.page-light .header,.page-light .header.is-solid{background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.07);backdrop-filter:none}
.page-light .logo-text{color:#1f1f1f}
.page-light .nav a{color:#6b5e67}
.page-light .nav a:hover{color:#1b1b1b}
.page-light .nav a[aria-current="page"]{color:#1b1b1b;font-weight:700}
.page-light .nav a::after{background:#1b1b1b}
.page-light .icon-btn{color:#3a3a3a}
.page-light .icon-btn:hover{background:rgba(0,0,0,.06)}
.page-light .btn-outline{background:#22231c;border-color:#22231c;color:#fff}
.page-light .btn-outline:hover{background:#000}
.page-light .burger span,.page-light .burger span::before,.page-light .burger span::after{background:#1b1b1b}
@media (max-width:860px){
  .page-light .nav{background:rgba(255,255,255,.98)}
  .page-light .nav a{border-bottom-color:rgba(0,0,0,.08)}
}
.lede{font-size:clamp(17px,1.6vw,23px);line-height:1.55;color:var(--c-ink);max-width:760px}
.prose p{font-size:clamp(15px,1.35vw,19px);line-height:1.65;color:var(--c-body)}
.prose p + p{margin-top:18px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
@media (max-width:900px){.two-col{grid-template-columns:1fr;gap:34px}}

/* filters removed */
.ev-filters{display:none;flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:44px}
.ev-filters button{
  height:42px;padding:0 20px;border:1px solid #b4b4b4;border-radius:var(--r-full);
  font-family:var(--font-display);font-size:13.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--c-body);background:#fff;
  transition:all var(--t-fast) var(--ease);
}
.ev-filters button:hover{border-color:#6b5e67;color:var(--c-ink)}
.ev-filters button[aria-pressed="true"]{background:#22231c;border-color:#22231c;color:#fff}
.ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.ev-card{
  background:#fff;border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 8px 26px rgba(23,30,35,.10);
  transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);
}
.ev-card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(23,30,35,.16)}
.ev-card .thumb{height:200px;overflow:hidden;background:#eceff0}
.ev-card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform 900ms var(--ease)}
.ev-card:hover .thumb img{transform:scale(1.05)}
.ev-body{padding:22px 24px 0;flex:1}
.ev-month{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--c-muted)}
.ev-day{font-family:var(--font-display);font-size:33px;font-weight:700;color:var(--c-ink-strong);line-height:1.15;margin-top:2px}
.ev-title{font-size:19px;font-weight:600;color:var(--c-ink);margin-top:12px;line-height:1.35}
.ev-meta{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:16px;color:var(--c-body)}
.ev-meta svg{width:16px;height:16px;flex-shrink:0;color:var(--c-muted)}
.ev-blurb{margin-top:10px;font-size:15px;line-height:1.55;color:var(--c-body)}
.ev-tag{
  display:inline-block;margin-top:14px;padding:5px 12px;border-radius:var(--r-full);
  background:var(--c-green-bg);font-size:12.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:#3c6a45;
}
.ev-foot{margin-top:20px;padding:16px 24px 20px;border-top:1px solid var(--c-line);display:flex;gap:18px;align-items:center}
.ev-empty{text-align:center;padding:60px 0;color:var(--c-body);font-size:18px}
@media (max-width:1000px){.ev-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:680px){.ev-grid{grid-template-columns:1fr}}

</style>
</head>
<body class="page-light" data-page="events">
<a class="skip" href="#main">Skip to content</a>
<div data-component="header"></div>

<main id="main">

  <section class="page-hero">
    <img src="assets/img/winkler-garden.jpg" alt="A planted bed in flower beside a mown path">
    <div class="container">
      <p class="crumb"><a href="index.html">Home</a> / <span>Events</span></p>
      <h1>What's on<br>this season</h1>
      <p>Guided walks, family sessions and volunteer mornings, run through the season by the preserve team. Most are free; guided walks are capped and need a place booking.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="ev-grid" id="evGrid"></div>
      <p class="ev-empty" id="evEmpty" hidden>Nothing in that category yet — try another filter.</p>
    </div>
  </section>

</main>

<div data-component="footer"></div>
<script src="assets/js/search-index.js"></script>
<script src="assets/js/components.js"></script>
<script>
/* ---- event data: swap for a CMS or API response ---- */
const EVENTS = [
  { month:'July', day:'12', title:'Native plant walk', place:"Catherine's Lodge", type:'Guided',
    img:'assets/img/winkler-garden.jpg', free:true,
    blurb:'An hour on the lower loops looking at what is actually growing here, and why almost all of it was chosen.' },
  { month:'July', day:'21', title:'Dawn chorus bird walk', place:'Green Trail', type:'Guided',
    img:'assets/img/winkler-stream.jpg', free:false,
    blurb:'Meet at first light for the loudest half hour of the day. Binoculars useful, patience more so.' },
  { month:'July', day:'28', title:'Pond life for families', place:'The pond', type:'Family',
    img:'assets/img/winkler-pond.jpg', free:true,
    blurb:'Nets, trays and a close look at what lives in the shallows. Everything goes back where it came from.' },
  { month:'Aug', day:'09', title:'Volunteer planting morning', place:'Native plant areas', type:'Volunteering',
    img:'assets/img/winkler-bench.jpg', free:true,
    blurb:'Three hours of planting and mulching with the preserve crew. Tools provided; gloves worth bringing.' },
  { month:'Aug', day:'24', title:'Woodland photography walk', place:'The waterfall', type:'Guided',
    img:'assets/img/winkler-waterfall.jpg', free:false,
    blurb:'Slow walking, tripods welcome. We work the falls and the bridges while the light is still low.' },
  { month:'Sept', day:'14', title:'Autumn colour walk', place:'Green Trail', type:'Guided',
    img:'assets/img/winkler-pond-rail.jpg', free:false,
    blurb:'The full outer loop as the canopy turns, with stops for the species putting on the best show.' },
  { month:'Sept', day:'28', title:'Trail maintenance day', place:'All loops', type:'Volunteering',
    img:'assets/img/winkler-bridge.jpg', free:true,
    blurb:'Clearing tread, cutting back growth and checking the bridges before the wet season.' },
  { month:'Oct', day:'12', title:'Fungi and decay walk', place:'Red Trail', type:'Guided',
    img:'assets/img/winkler-lodge.jpg', free:false,
    blurb:'What appears once the leaves drop, and the part it plays in keeping the woodland going.' }
];

const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>';
const ARR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
const grid = document.getElementById('evGrid');
const empty = document.getElementById('evEmpty');
function render(){
  const list = EVENTS;
  empty.hidden = list.length > 0;
  grid.innerHTML = list.map(e => `
    <article class="ev-card reveal">
      <div class="thumb"><img src="${e.img}" alt="${e.title}" loading="lazy"></div>
      <div class="ev-body">
        <p class="ev-month">${e.month}</p>
        <p class="ev-day">${e.day}</p>
        <h2 class="ev-title">${e.title}</h2>
        <p class="ev-meta">${PIN}${e.place}</p>
        <p class="ev-blurb">${e.blurb}</p>
        <span class="ev-tag">${e.type}${e.free ? ' · Free' : ' · Booking needed'}</span>
      </div>
      <div class="ev-foot">
        <a class="link-cta" href="#main">Learn more ${ARR}</a>
        ${e.free ? '' : '<button class="link-cta" data-book>Book ' + ARR + '</button>'}
      </div>
    </article>`).join('');
  if(window.__reveal) window.__reveal(grid);
}
render();
</script>
</body>
</html>
